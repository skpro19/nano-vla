[project]
name = "nano-vla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libero",
    "robosuite==1.4.0",
    "mujoco==3.2.7",
    "numpy==2.2.6",
    "numba==0.68.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "opencv-python-headless==4.13.0.92",
    "bddl==1.0.1",
    "gym==0.25.2",
    "cloudpickle==3.1.2",
    "h5py==3.16.0",
    "PyYAML==6.0.3",
    "termcolor==3.3.0",
    "torch==2.14.0+cu126",
    "torchvision==0.29.1+cu126",
    "lerobot[smolvla,training]",
]

[dependency-groups]
notebook = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
]

[tool.uv.sources]
libero = { path = "third_party/LIBERO", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cpu" }
lerobot = { path = "third_party/lerobot", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# robosuite only needs cv2; use LeRobot's headless provider to avoid
# installing two OpenCV distributions into the same namespace.
[[tool.uv.dependency-metadata]]
name = "robosuite"
version = "1.4.0"
requires-dist = [
    "numpy>=1.13.3",
    "numba>=0.49.1",
    "scipy>=1.2.3",
    "mujoco>=2.3.0",
    "Pillow",
    "opencv-python-headless",
]

